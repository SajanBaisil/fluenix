# Pings the Render free-tier backend so it doesn't spin down (idle timeout
# ~15 min; cold starts add ~1 min to the first call of the day otherwise).
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: curl -fsS --max-time 30 https://fluenix-api.onrender.com/healthz || true
