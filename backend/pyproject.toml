[project]
name = "fluenix-backend"
version = "0.1.0"
description = "Fluenix slim API: voice-session tokens, metering, call lifecycle"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
